<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SlideReel — Photos to Video</title>
<link rel="stylesheet" href="forge.css">
<style>
#view{display:block;max-width:100%;max-height:calc(100vh - 170px);border-radius:8px;background:#000;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.slides{display:flex;flex-direction:column;gap:8px}
.slide{display:flex;gap:10px;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--panel-2);cursor:pointer}
.slide.sel{border-color:var(--warn)}
.slide img{width:58px;height:58px;object-fit:cover;border-radius:8px;flex:none}
.sl-body{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
.sl-top{display:flex;justify-content:space-between;align-items:center;font-size:12px}
.sl-top span{display:flex;gap:4px}
.sl-top button{padding:2px 7px}
.sl-body input{padding:5px 8px;font-size:12px}
.music{font-size:12px;color:var(--muted);word-break:break-word}
</style>
</head>
<body class="app">
<header>
  <a class="brand" href="index.html"><div class="logo">🎞</div>SlideReel <small>photos + captions + music → video · free</small></a>
  <a class="home-link" href="index.html">← All tools</a>
</header>
<main class="split">
<aside>
  <label class="drop" id="drop"><input type="file" id="fileInput" accept="image/*" multiple hidden><div class="drop-icon">🖼️</div><strong>Drop your photos here</strong><span>or click to choose · JPG, PNG, WebP · many at once</span></label>
  <div class="slides" id="slides"></div>

  <div class="stack">
    <div><div class="label">Video shape</div>
      <select id="format"><option value="9:16">Vertical 9:16 (TikTok, Reels, Status)</option><option value="16:9">Wide 16:9 (YouTube)</option><option value="1:1">Square 1:1 (Instagram)</option></select>
    </div>
    <label class="slider">Seconds per photo <input type="range" id="dur" min="2" max="8" step="0.5" value="3"><b id="durVal">3s</b></label>
    <div><div class="label">Photo fit</div>
      <select id="fit"><option value="fill">Fill the screen (crops edges)</option><option value="whole">Show the whole photo (blurred background)</option></select>
    </div>
    <label class="check"><input type="checkbox" id="fade" checked> Smooth fade between photos</label>
    <label class="check"><input type="checkbox" id="zoom" checked> Slow zoom movement</label>
    <div><div class="label">Caption style</div>
      <div class="row"><select id="look"><option value="box">White on dark box</option><option value="outline">White with outline</option><option value="yellow">Yellow with outline</option></select><select id="pos"><option value="bottom">Bottom</option><option value="middle">Middle</option><option value="top">Top</option></select></div>
    </div>
    <label class="slider">Caption size <input type="range" id="size" min="3" max="10" step="0.5" value="5"></label>
    <label class="check"><input type="checkbox" id="upper"> CAPITAL LETTERS</label>
    <div><div class="label">Music (optional)</div>
      <div class="row"><label class="mini" style="text-align:center;border:1px solid var(--line);border-radius:8px;padding:7px;cursor:pointer;background:var(--panel-2)">🎵 Choose music<input type="file" id="musicInput" accept="audio/*" hidden></label><button class="mini hidden" id="musicRemove">Remove</button></div>
      <div class="music" id="musicName">No music. The video will be silent.</div>
    </div>
  </div>

  <button id="previewBtn" disabled>▶ Play preview</button>
  <button class="primary big" id="makeBtn" disabled>Create video</button>
  <button id="cancelBtn" class="hidden">Cancel</button>
  <div class="hidden" id="prog"><div class="bar"><div id="bar"></div></div><div class="ptext" id="ptext"></div></div>
  <div class="note hidden" id="note"></div>
  <div class="result hidden" id="doneBox"><button class="primary big" id="downloadBtn">⬇ Download video</button><video id="resultVideo" controls playsinline></video></div>
</aside>
<section class="out">
  <div class="out-head"><span id="hint">Add photos to start</span><span id="info"></span></div>
  <div class="stage"><canvas id="view" width="1080" height="1920"></canvas></div>
</section>
</main>
<div class="toast" id="toast"></div>

<script type="module">
  import * as Bridge from './forge-bridge.js';
Bridge.dock('maker');
const $=id=>document.getElementById(id);
const view=$('view'), vctx=view.getContext('2d');
let MBP=null;
const loadMB=()=>MBP||(MBP=import('https://cdn.jsdelivr.net/npm/mediabunny/+esm').catch(()=>import('https://esm.sh/mediabunny')));
let slides=[], sel=0, musicFile=null, musicUrl=null, busy=false, cancelled=false, playing=false, raf=0, pstart=0;
let resultBlob=null, resultUrl=null, wakeLock=null;
const aud=new Audio();
const FORMATS={ '9:16':[1080,1920], '16:9':[1920,1080], '1:1':[1080,1080] };
const dims=()=>FORMATS[$('format').value];
const D=()=>+$('dur').value;
const totalDur=()=>slides.length*D();

const show=id=>$(id).classList.remove('hidden');
const hide=id=>$(id).classList.add('hidden');
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2400); }
function showNote(m,type){ const n=$('note'); n.textContent=m; n.className='note'+(type==='ok'?' ok':''); show('note'); }
function fmtSize(b){ return b>1048576?(b/1048576).toFixed(1)+' MB':Math.max(1,Math.round(b/1024))+' KB'; }
function fmtTime(s){ s=Math.round(s); return s<60 ? s+'s' : Math.floor(s/60)+'m '+(s%60)+'s'; }
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function setP(p,text){ $('bar').style.width=(clamp(p,0,1)*100).toFixed(1)+'%'; if(text) $('ptext').textContent=text; }
async function keepAwake(on){ try{ if(on && 'wakeLock' in navigator) wakeLock=await navigator.wakeLock.request('screen'); else if(!on && wakeLock){ await wakeLock.release(); wakeLock=null; } }catch{} }
window.addEventListener('beforeunload',e=>{ if(busy){ e.preventDefault(); e.returnValue=''; } });

/* ---------- captions ---------- */
function wrapLines(ctx,text,maxW){
  const words=text.split(/\s+/).filter(Boolean), lines=[]; let line='';
  for(const w of words){ const test=line?line+' '+w:w; if(ctx.measureText(test).width>maxW && line){ lines.push(line); line=w; } else line=test; }
  if(line) lines.push(line); return lines;
}
function drawCaption(ctx,W,H,text,st){
  if(!text) return;
  if(st.upper) text=text.toUpperCase();
  const fs=Math.max(12,Math.round(Math.min(W,H)*st.size/100));
  ctx.save();
  ctx.font='800 '+fs+'px "Segoe UI", Roboto, Arial, sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  const lines=wrapLines(ctx,text,W*0.86), lh=fs*1.3, total=lines.length*lh;
  const top = st.pos==='top' ? H*0.08 : st.pos==='middle' ? (H-total)/2 : H*0.88-total;
  lines.forEach((ln,i)=>{
    const y=top+i*lh+lh/2;
    if(st.look==='box'){
      const w=ctx.measureText(ln).width+fs*0.7;
      ctx.fillStyle='rgba(0,0,0,0.72)'; ctx.beginPath();
      if(ctx.roundRect) ctx.roundRect(W/2-w/2,y-lh/2,w,lh,fs*0.22); else ctx.rect(W/2-w/2,y-lh/2,w,lh);
      ctx.fill(); ctx.fillStyle='#ffffff'; ctx.fillText(ln,W/2,y);
    }else{
      ctx.lineJoin='round'; ctx.lineWidth=Math.max(3,fs*0.18); ctx.strokeStyle='#000000'; ctx.strokeText(ln,W/2,y);
      ctx.fillStyle= st.look==='yellow' ? '#ffd60a' : '#ffffff'; ctx.fillText(ln,W/2,y);
    }
  });
  ctx.restore();
}
const getStyle=()=>({ size:+$('size').value, pos:$('pos').value, look:$('look').value, upper:$('upper').checked });

/* ---------- drawing one moment of the video ---------- */
function drawSlide(ctx,W,H,i,lt,alpha,dur,st){
  const s=slides[i], img=s.bmp, iw=img.width, ih=img.height;
  const p=clamp((lt+0.7)/(dur+0.7),0,1);
  const zoomOn=$('zoom').checked, z=zoomOn ? 1+0.1*p : 1;
  ctx.save(); ctx.globalAlpha=alpha;
  if($('fit').value==='whole'){
    ctx.save(); ctx.filter='blur(40px) brightness(0.55)';
    const cb=Math.max(W/iw,H/ih)*1.15;
    ctx.drawImage(img,(W-iw*cb)/2,(H-ih*cb)/2,iw*cb,ih*cb);
    ctx.restore();
    const cs=Math.min(W/iw,H/ih)*(zoomOn ? 1+0.05*p : 1);
    ctx.drawImage(img,(W-iw*cs)/2,(H-ih*cs)/2,iw*cs,ih*cs);
  }else{
    const sc=Math.max(W/iw,H/ih)*z, dw=iw*sc, dh=ih*sc;
    const pan=zoomOn ? (dw-W)*0.5*(p-0.5)*(i%2 ? -1 : 1) : 0;
    ctx.drawImage(img,(W-dw)/2+pan,(H-dh)/2,dw,dh);
  }
  if(s.caption) drawCaption(ctx,W,H,s.caption,st);
  ctx.restore();
}
function drawFrame(ctx,W,H,t,st){
  ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H);
  const n=slides.length; if(!n) return;
  const dur=D(), T=$('fade').checked ? Math.min(0.7,dur/3) : 0;
  const i=Math.min(n-1,Math.floor(t/dur)), lt=t-i*dur;
  drawSlide(ctx,W,H,i,lt,1,dur,st);
  if(T && i<n-1 && lt>dur-T) drawSlide(ctx,W,H,i+1,lt-dur,(lt-(dur-T))/T,dur,st);
}
function drawStill(){
  if(playing) return;
  const [W,H]=dims();
  if(view.width!==W || view.height!==H){ view.width=W; view.height=H; }
  if(!slides.length){ vctx.fillStyle='#000'; vctx.fillRect(0,0,W,H); return; }
  sel=clamp(sel,0,slides.length-1);
  drawFrame(vctx,W,H,sel*D()+0.05,getStyle());
}

/* ---------- photos ---------- */
const drop=$('drop');
$('fileInput').onchange=e=>{ addImages([...e.target.files]); e.target.value=''; };
drop.addEventListener('dragover',e=>{ e.preventDefault(); drop.classList.add('over'); });
drop.addEventListener('dragleave',()=>drop.classList.remove('over'));
drop.addEventListener('drop',e=>{ e.preventDefault(); drop.classList.remove('over'); addImages([...e.dataTransfer.files]); });

async function addImages(files){
  if(busy) return;
  for(const f of files){
    if(!f.type.startsWith('image/')) continue;
    try{
      let bmp=await createImageBitmap(f);
      const m=Math.max(bmp.width,bmp.height);
      if(m>2400){
        const k=2400/m;
        const small=await createImageBitmap(bmp,{ resizeWidth:Math.round(bmp.width*k), resizeHeight:Math.round(bmp.height*k), resizeQuality:'high' });
        bmp.close(); bmp=small;
      }
      slides.push({ bmp, thumb:URL.createObjectURL(f), caption:'' });
    }catch{ toast('Could not open '+f.name+' (iPhone HEIC photos must be converted to JPG first)'); }
  }
  renderSlides(); drawStill();
}
function renderSlides(){
  $('slides').innerHTML=slides.map((s,i)=>
    '<div class="slide'+(i===sel?' sel':'')+'" data-i="'+i+'"><img src="'+s.thumb+'" alt=""><div class="sl-body"><div class="sl-top"><b>Photo '+(i+1)+'</b><span><button class="up" title="Move up">↑</button><button class="down" title="Move down">↓</button><button class="del" title="Remove">✕</button></span></div><input type="text" class="cap" placeholder="Caption (optional)" value="'+esc(s.caption)+'"></div></div>'
  ).join('');
  const n=slides.length;
  $('makeBtn').disabled=!n || busy; $('previewBtn').disabled=!n || busy;
  $('hint').textContent = n ? 'Click a photo on the left to see it here' : 'Add photos to start';
  $('info').textContent = n ? n+' photos · '+fmtTime(totalDur())+' video' : '';
}
$('slides').addEventListener('input',e=>{
  if(!e.target.classList.contains('cap')) return;
  const i=+e.target.closest('.slide').dataset.i; slides[i].caption=e.target.value; sel=i; drawStill();
});
$('slides').addEventListener('click',e=>{
  const row=e.target.closest('.slide'); if(!row || busy) return;
  const i=+row.dataset.i, c=e.target.classList;
  if(c.contains('up') && i>0){ [slides[i-1],slides[i]]=[slides[i],slides[i-1]]; sel=i-1; }
  else if(c.contains('down') && i<slides.length-1){ [slides[i+1],slides[i]]=[slides[i],slides[i+1]]; sel=i+1; }
  else if(c.contains('del')){ slides[i].bmp.close(); URL.revokeObjectURL(slides[i].thumb); slides.splice(i,1); sel=Math.max(0,i-1); }
  else if(c.contains('cap')) { sel=i; drawStill(); return; }
  else sel=i;
  renderSlides(); drawStill();
});
$('dur').addEventListener('input',()=>{ $('durVal').textContent=$('dur').value+'s'; renderSlides(); drawStill(); });
['format','fit','fade','zoom','look','pos','size','upper'].forEach(id=>$(id).addEventListener('input',drawStill));

/* ---------- music ---------- */
$('musicInput').onchange=e=>{
  const f=e.target.files[0]; e.target.value=''; if(!f) return;
  musicFile=f; if(musicUrl) URL.revokeObjectURL(musicUrl); musicUrl=URL.createObjectURL(f); aud.src=musicUrl;
  $('musicName').textContent='🎵 '+f.name+' (fades in and out automatically)'; show('musicRemove');
};
$('musicRemove').onclick=()=>{ musicFile=null; aud.pause(); aud.removeAttribute('src'); $('musicName').textContent='No music. The video will be silent.'; hide('musicRemove'); };
async function prepareMusic(f,total){
  const ctx=new AudioContext();
  let dec;
  try{ dec=await ctx.decodeAudioData(await f.arrayBuffer()); } finally { ctx.close(); }
  const sr=dec.sampleRate, len=Math.max(1,Math.ceil(total*sr));
  const off=new OfflineAudioContext(2,len,sr);
  const src=off.createBufferSource(); src.buffer=dec; src.loop=dec.duration<total;
  const g=off.createGain(); src.connect(g); g.connect(off.destination);
  const fi=Math.min(1,total/4), fo=Math.min(2,total/4);
  g.gain.setValueAtTime(0,0); g.gain.linearRampToValueAtTime(1,fi);
  g.gain.setValueAtTime(1,Math.max(fi,total-fo)); g.gain.linearRampToValueAtTime(0,total);
  src.start(0);
  return await off.startRendering();
}

/* ---------- preview ---------- */
function stopPreview(){
  playing=false; cancelAnimationFrame(raf); aud.pause();
  $('previewBtn').textContent='▶ Play preview'; drawStill();
}
$('previewBtn').onclick=()=>{
  if(!slides.length) return;
  if(playing) return stopPreview();
  const [W,H]=dims(); view.width=W; view.height=H;
  playing=true; $('previewBtn').textContent='■ Stop preview'; pstart=performance.now();
  if(musicFile){ aud.currentTime=0; aud.play().catch(()=>{}); }
  const st=getStyle();
  const tick=()=>{
    if(!playing) return;
    const t=(performance.now()-pstart)/1000;
    if(t>=totalDur()) return stopPreview();
    drawFrame(vctx,W,H,t,st);
    raf=requestAnimationFrame(tick);
  };
  tick();
};

/* ---------- create the video ---------- */
function setBusy(on){
  busy=on;
  $('makeBtn').disabled=on || !slides.length; $('previewBtn').disabled=on || !slides.length;
  on ? show('cancelBtn') : hide('cancelBtn');
  drop.style.pointerEvents=on?'none':''; $('slides').style.pointerEvents=on?'none':'';
  keepAwake(on);
}
$('cancelBtn').onclick=()=>{ cancelled=true; $('ptext').textContent='Cancelling…'; };

$('makeBtn').onclick=async()=>{
  if(!slides.length || busy) return;
  if(!('VideoEncoder' in window)) return showNote('Creating videos needs Google Chrome or Microsoft Edge on a computer.');
  stopPreview(); cancelled=false; setBusy(true);
  hide('note'); hide('doneBox'); show('prog'); setP(0,'Loading the video engine…');
  let output=null;
  try{
    const MB=await loadMB();
    const [W,H]=dims(), fps=30, total=totalDur(), frames=Math.ceil(total*fps), st=getStyle();
    const canvas=document.createElement('canvas'); canvas.width=W; canvas.height=H;
    const ctx=canvas.getContext('2d');
    output=new MB.Output({ format:new MB.Mp4OutputFormat({ fastStart:'in-memory' }), target:new MB.BufferTarget() });

    let vcodec='avc';
    try{ if(MB.getFirstEncodableVideoCodec) vcodec=(await MB.getFirstEncodableVideoCodec(output.format.getSupportedVideoCodecs(),{ width:W, height:H }))||'avc'; }catch{}
    const vsrc=new MB.CanvasSource(canvas,{ codec:vcodec, quality:new MB.Quality('high') });
    output.addVideoTrack(vsrc,{ frameRate:fps });

    let asrc=null, abuf=null;
    if(musicFile){
      setP(0,'Preparing the music…');
      abuf=await prepareMusic(musicFile,total);
      let acodec='aac';
      try{ if(MB.getFirstEncodableAudioCodec) acodec=(await MB.getFirstEncodableAudioCodec(output.format.getSupportedAudioCodecs(),{ numberOfChannels:abuf.numberOfChannels, sampleRate:abuf.sampleRate }))||'aac'; }catch{}
      asrc=new MB.AudioBufferSource({ codec:acodec, quality:new MB.Quality('high') });
      output.addAudioTrack(asrc);
    }

    await output.start();
    if(asrc){ await asrc.add(abuf); asrc.close(); }

    const t0=performance.now();
    for(let f=0; f<frames; f++){
      if(cancelled) break;
      drawFrame(ctx,W,H,f/fps,st);
      await vsrc.add(f/fps,1/fps);
      if(f%10===0){
        const p=f/frames, secs=(performance.now()-t0)/1000;
        setP(p,'Creating video… '+Math.round(p*100)+'%'+(p>0.05?' · about '+fmtTime(secs/p*(1-p))+' left':''));
      }
    }
    vsrc.close();
    if(cancelled){ await output.cancel(); hide('prog'); showNote('Cancelled.'); return; }
    setP(1,'Finishing…');
    await output.finalize();

    resultBlob=new Blob([output.target.buffer],{type:'video/mp4'});
    if(resultUrl) URL.revokeObjectURL(resultUrl);
    resultUrl=URL.createObjectURL(resultBlob);
    $('resultVideo').src=resultUrl;
    setP(1,'Finished in '+fmtTime((performance.now()-t0)/1000)+' · '+fmtSize(resultBlob.size));
    show('doneBox'); showNote('Done! Play it below, then click Download.','ok');
  }catch(err){
    showNote('Something went wrong: '+(err.message||err)+'. Try fewer or smaller photos, or a different music file.');
    try{ if(output) await output.cancel(); }catch{}
  }finally{
    setBusy(false);
  }
};
$('downloadBtn').onclick=()=>{
  if(!resultBlob) return;
  const a=document.createElement('a'); a.href=resultUrl; a.download='slidereel-video.mp4';
  document.body.appendChild(a); a.click(); a.remove();
};

drawStill();
</script>
</body>
</html>
