<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VideoKit — Trim, Compress, Resize, Convert</title>
<link rel="stylesheet" href="forge.css">
<style>
#video{display:block;max-width:100%;max-height:calc(100vh - 170px);border-radius:6px;background:#000}
</style>
</head>
<body class="app">
<header>
  <a class="brand" href="index.html"><div class="logo">✂</div>VideoKit <small>trim · compress · resize · convert · extract audio</small></a>
  <a class="home-link" href="index.html">← All tools</a>
</header>
<main class="split">
<aside>
  <label class="drop" id="drop"><input type="file" id="fileInput" accept="video/*,.mp4,.mov,.webm,.mkv,.m4v" hidden><div class="drop-icon">✂️</div><strong>Drop your video here</strong><span>or click to choose · MP4, MOV, WebM, MKV</span></label>
  <div class="file-info" id="fileInfo">No video selected</div>

  <div>
    <div class="label">Trim (seconds · leave blank to keep everything)</div>
    <div class="row"><input type="number" id="tStart" min="0" step="0.1" placeholder="Start"><input type="number" id="tEnd" min="0" step="0.1" placeholder="End"></div>
    <div class="row" style="margin-top:6px"><button class="mini" id="setStart">Start = now</button><button class="mini" id="setEnd">End = now</button><button class="mini" id="clearTrim">Keep all</button></div>
  </div>
  <div><div class="label">Shape</div>
    <select id="shape">
      <option value="">Keep original</option>
      <option value="9:16">Vertical 9:16 (TikTok, Reels, Status)</option>
      <option value="1:1">Square 1:1 (Instagram post)</option>
      <option value="16:9">Wide 16:9 (YouTube)</option>
    </select>
  </div>
  <div><div class="label">Size</div>
    <select id="size"><option value="0">Keep original</option><option value="1080">1080p (Full HD)</option><option value="720">720p (HD, smaller)</option><option value="480">480p (very small)</option></select>
  </div>
  <div><div class="label">Compression</div>
    <select id="quality"><option value="keep">None (fastest)</option><option value="high">Light (great quality)</option><option value="medium">Medium (smaller file)</option><option value="low">Strong (smallest file)</option></select>
  </div>
  <div><div class="label">Sound</div>
    <select id="sound"><option value="keep">Keep sound</option><option value="remove">Remove sound</option></select>
  </div>
  <div><div class="label">Save as</div>
    <select id="format"><option value="mp4">MP4 video (works everywhere)</option><option value="webm">WebM video</option><option value="m4a">Audio only: M4A (music, WhatsApp)</option><option value="wav">Audio only: WAV (editing)</option></select>
  </div>

  <button class="primary big" id="runBtn" disabled>Convert</button>
  <button id="cancelBtn" class="hidden">Cancel</button>
  <div class="hidden" id="prog"><div class="bar"><div id="bar"></div></div><div class="ptext" id="ptext"></div></div>
  <div class="note hidden" id="note"></div>
  <div class="result hidden" id="doneBox"><button class="primary big" id="downloadBtn">⬇ Download</button><video id="resultVideo" controls playsinline></video></div>
</aside>
<section class="out">
  <div class="out-head"><span id="hint">Your video appears here</span><span id="estimate"></span></div>
  <div class="stage"><div class="empty" id="empty">✂️<br>Open a video to start</div><video id="video" class="hidden" controls playsinline preload="auto"></video></div>
</section>
</main>
<div class="toast" id="toast"></div>

<script type="module">
  import * as Bridge from './forge-bridge.js';
Bridge.dock('toolkit');
const $=id=>document.getElementById(id);
const video=$('video');
let MBP=null;
const loadMB=()=>MBP||(MBP=import('https://cdn.jsdelivr.net/npm/mediabunny/+esm').catch(()=>import('https://esm.sh/mediabunny')));
let file=null, url=null, busy=false, conv=null, resultBlob=null, resultUrl=null, resultName='', wakeLock=null;

const show=id=>$(id).classList.remove('hidden');
const hide=id=>$(id).classList.add('hidden');
function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2400); }
function showNote(m,type){ const n=$('note'); n.textContent=m; n.className='note'+(type==='ok'?' ok':''); show('note'); }
function fmtSize(b){ return b>1073741824?(b/1073741824).toFixed(2)+' GB':b>1048576?(b/1048576).toFixed(1)+' MB':Math.max(1,Math.round(b/1024))+' KB'; }
function fmtClock(s){ if(!isFinite(s)) return '0:00'; s=Math.max(0,s); return Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0'); }
function fmtTime(s){ s=Math.round(s); return s<60 ? s+'s' : Math.floor(s/60)+'m '+(s%60)+'s'; }
function setP(p,text){ $('bar').style.width=(Math.min(1,Math.max(0,p))*100).toFixed(1)+'%'; if(text) $('ptext').textContent=text; }
async function keepAwake(on){ try{ if(on && 'wakeLock' in navigator) wakeLock=await navigator.wakeLock.request('screen'); else if(!on && wakeLock){ await wakeLock.release(); wakeLock=null; } }catch{} }
window.addEventListener('beforeunload',e=>{ if(busy){ e.preventDefault(); e.returnValue=''; } });
if(!('VideoEncoder' in window)) showNote('Please open this page in Google Chrome or Microsoft Edge on a computer.');

/* ---------- loading ---------- */
const drop=$('drop');
$('fileInput').onchange=e=>{ loadFile(e.target.files[0]); e.target.value=''; };
drop.addEventListener('dragover',e=>{ e.preventDefault(); drop.classList.add('over'); });
drop.addEventListener('dragleave',()=>drop.classList.remove('over'));
drop.addEventListener('drop',e=>{ e.preventDefault(); drop.classList.remove('over'); loadFile(e.dataTransfer.files[0]); });
function loadFile(f){
  if(!f || busy) return;
  if(!f.type.startsWith('video/') && !/\.(mp4|mov|webm|mkv|m4v)$/i.test(f.name)) return toast('Please choose a video file');
  file=f; if(url) URL.revokeObjectURL(url); url=URL.createObjectURL(f);
  ['note','prog','doneBox'].forEach(hide);
  $('tStart').value=''; $('tEnd').value='';
  $('fileInfo').textContent='Opening '+f.name+'…';
  video.src=url; loadMB().catch(()=>{});
}
video.addEventListener('loadedmetadata',()=>{
  hide('empty'); show('video');
  $('fileInfo').textContent=file.name+' · '+fmtSize(file.size)+' · '+video.videoWidth+'×'+video.videoHeight+' · '+fmtClock(video.duration);
  $('hint').textContent='Choose your settings on the left, then click Convert';
  $('runBtn').disabled=false; updateEstimate();
});
video.addEventListener('error',()=>{ if(file) showNote('Your browser cannot preview this file, but you can still try converting it.'); $('runBtn').disabled=!file; });

$('setStart').onclick=()=>{ $('tStart').value=video.currentTime.toFixed(1); };
$('setEnd').onclick=()=>{ $('tEnd').value=video.currentTime.toFixed(1); };
$('clearTrim').onclick=()=>{ $('tStart').value=''; $('tEnd').value=''; };
['shape','size','format'].forEach(id=>$(id).addEventListener('change',updateEstimate));

/* ---------- settings → output size ---------- */
function plan(){
  const W=video.videoWidth||0, H=video.videoHeight||0;
  let cw=W, ch=H, crop=null;
  const ratio={ '9:16':9/16, '1:1':1, '16:9':16/9 }[$('shape').value];
  if(ratio && W && H){
    if(W/H>ratio){ cw=Math.round(H*ratio); ch=H; } else { cw=W; ch=Math.round(W/ratio); }
    cw-=cw%2; ch-=ch%2;
    crop={ left:Math.round((W-cw)/2), top:Math.round((H-ch)/2), width:cw, height:ch };
  }
  let ow=cw, oh=ch;
  const target=+$('size').value, short=Math.min(cw,ch);
  if(target && short && target<short){ const k=target/short; ow=Math.round(cw*k/2)*2; oh=Math.round(ch*k/2)*2; }
  return { crop, ow, oh, resized: ow!==cw || oh!==ch };
}
function updateEstimate(){
  if(!video.videoWidth) return;
  const fmt=$('format').value;
  if(fmt==='m4a'||fmt==='wav'){ $('estimate').textContent='Output: audio only'; return; }
  const p=plan(); $('estimate').textContent='Output: '+p.ow+'×'+p.oh;
}

/* ---------- convert ---------- */
function setBusy(on){
  busy=on; $('runBtn').disabled=on || !file;
  on ? show('cancelBtn') : hide('cancelBtn');
  ['tStart','tEnd','shape','size','quality','sound','format','setStart','setEnd','clearTrim'].forEach(id=>$(id).disabled=on);
  drop.style.pointerEvents=on?'none':'';
  keepAwake(on);
}
$('cancelBtn').onclick=async()=>{ if(conv){ $('ptext').textContent='Cancelling…'; try{ await conv.cancel(); }catch{} } };

$('runBtn').onclick=async()=>{
  if(!file || busy) return;
  video.pause(); setBusy(true); hide('note'); hide('doneBox'); show('prog'); setP(0,'Loading the video engine…');
  try{
    const MB=await loadMB();
    const fmt=$('format').value, audioOnly = fmt==='m4a' || fmt==='wav';
    const format = fmt==='webm' ? new MB.WebMOutputFormat() : fmt==='wav' ? new MB.WavOutputFormat() : new MB.Mp4OutputFormat({ fastStart:'in-memory' });
    const ext={ mp4:'mp4', webm:'webm', m4a:'m4a', wav:'wav' }[fmt];
    const mime={ mp4:'video/mp4', webm:'video/webm', m4a:'audio/mp4', wav:'audio/wav' }[fmt];
    const input=new MB.Input({ source:new MB.BlobSource(file), formats:MB.ALL_FORMATS });
    const output=new MB.Output({ format, target:new MB.BufferTarget() });
    const opts={ input, output };

    const dur=video.duration||0, s=parseFloat($('tStart').value), e=parseFloat($('tEnd').value), trim={};
    if(s>0) trim.start=s;
    if(e>0 && (!dur || e<dur-0.05)) trim.end=e;
    if(trim.start!==undefined && trim.end!==undefined && trim.end<=trim.start) throw new Error('the trim end must be after the start');
    if(Object.keys(trim).length) opts.trim=trim;

    if(audioOnly){
      if($('sound').value==='remove') throw new Error('you chose "Remove sound" together with an audio-only file');
      opts.video={ discard:true };
    }else{
      const p=plan(), v={}, q=$('quality').value;
      if(p.crop) v.crop=p.crop;
      if(p.resized){ v.width=p.ow; v.height=p.oh; v.fit='fill'; }
      if(q!=='keep') v.quality=new MB.Quality(q);
      opts.video=v;
      if($('sound').value==='remove') opts.audio={ discard:true };
    }

    conv=await MB.Conversion.init(opts);
    if(!conv.isValid) throw new Error('this file cannot be converted with these settings ('+(conv.discardedTracks||[]).map(d=>d.reason).join(', ')+')');
    const t0=performance.now();
    conv.onProgress=p=>{ const secs=(performance.now()-t0)/1000; setP(p,'Working… '+Math.round(p*100)+'%'+(p>0.02?' · about '+fmtTime(secs/p*(1-p))+' left':'')); };
    await conv.execute();

    resultBlob=new Blob([output.target.buffer],{type:mime});
    resultName=file.name.replace(/\.[^.]+$/,'')+'-edited.'+ext;
    if(resultUrl) URL.revokeObjectURL(resultUrl);
    resultUrl=URL.createObjectURL(resultBlob);
    $('resultVideo').src=resultUrl;
    const saved=file.size>resultBlob.size ? ' ('+Math.round((1-resultBlob.size/file.size)*100)+'% smaller)' : '';
    setP(1,'Finished in '+fmtTime((performance.now()-t0)/1000)+' · '+fmtSize(resultBlob.size)+saved);
    show('doneBox'); showNote('Done! Check the result below, then click Download.','ok');
  }catch(err){
    const c=err && (err.name==='ConversionCanceledError' || /cancel/i.test(err.message||''));
    showNote(c ? 'Cancelled.' : 'Something went wrong: '+(err.message||err)+'.');
  }finally{
    conv=null; setBusy(false);
  }
};
$('downloadBtn').onclick=()=>{
  if(!resultBlob) return;
  const a=document.createElement('a'); a.href=resultUrl; a.download=resultName;
  document.body.appendChild(a); a.click(); a.remove();
};
Bridge.take(document.querySelector('aside')).then(f=>{ if(f) loadFile(f); });
</script>
</body>
</html>
