<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Avatar Narrator — Talking Photos and Voice Cloning</title>
<style>
:root{color-scheme:dark;--bg:#0b0f17;--panel:#131a26;--line:#2a3548;--text:#eef2f8;--muted:#93a1b8;--accent:#d4af37}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
header{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line);background:var(--panel)}
header strong{font-size:16px}
.home-link{margin-left:auto;color:var(--muted);text-decoration:none;font-size:13px}
.home-link:hover{color:var(--text)}
main{flex:1;min-height:0;display:flex;flex-direction:column}
.intro{padding:10px 18px 0;color:var(--muted)}
.tabs{display:flex;gap:8px;padding:10px 18px}
.tabs button{flex:1;max-width:380px;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--text);font:inherit;font-weight:650;cursor:pointer}
.tabs button[aria-selected=true]{border-color:var(--accent);box-shadow:inset 0 -2px var(--accent)}
.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.workspace{flex:1;min-height:0}
.workspace[hidden]{display:none}
iframe{display:block;width:100%;height:100%;border:0;background:var(--bg)}
@media(max-width:600px){header{padding:10px 12px}.intro{padding:8px 12px 0}.tabs{padding:8px 12px}.tabs button{padding:9px 8px;font-size:13px}}
</style>
</head>
<body>
<header>
  <strong>🗣️ Avatar Narrator</strong>
  <a class="home-link" href="index.html">← All tools</a>
</header>
<main>
  <div class="intro">Natural voice-clone animation is selected by default for head and eye movement. Switch to Quick for a shorter setup.</div>
  <div class="tabs" role="tablist" aria-label="Avatar workflows">
    <button id="quickTab" type="button" role="tab" aria-selected="true" aria-controls="quickPanel">Quick talking photo</button>
    <button id="cloneTab" type="button" role="tab" aria-selected="false" aria-controls="clonePanel">Natural voice clone · saved &amp; resumable</button>
  </div>
  <section id="quickPanel" class="workspace" role="tabpanel" aria-labelledby="quickTab">
    <iframe id="quickFrame" title="Quick talking-photo workflow" src="avatar-narrator-quick.html"></iframe>
  </section>
  <section id="clonePanel" class="workspace" role="tabpanel" aria-labelledby="cloneTab" hidden>
    <iframe id="cloneFrame" title="Voice-clone workflow with saved projects and resumable clips" data-src="avatar-voice-clone.html"></iframe>
  </section>
</main>
<script>
(() => {
  const tabs = {
    quick: {button: document.getElementById('quickTab'), panel: document.getElementById('quickPanel')},
    'voice-clone': {button: document.getElementById('cloneTab'), panel: document.getElementById('clonePanel')}
  };

  function selectMode(mode, updateAddress) {
    const selected = tabs[mode] ? mode : 'quick';
    for (const [name, tab] of Object.entries(tabs)) {
      const active = name === selected;
      tab.button.setAttribute('aria-selected', String(active));
      tab.panel.hidden = !active;
    }

    const frame = selected === 'voice-clone' ? document.getElementById('cloneFrame') : null;
    if (frame && !frame.getAttribute('src')) frame.src = frame.dataset.src;

    if (updateAddress) {
      const url = new URL(location.href);
      if (selected === 'quick') url.searchParams.delete('mode');
      else url.searchParams.set('mode', selected);
      history.replaceState(null, '', url);
    }
  }

  document.getElementById('quickTab').addEventListener('click', () => selectMode('quick', true));
  document.getElementById('cloneTab').addEventListener('click', () => selectMode('voice-clone', true));
  document.querySelector('.tabs').addEventListener('keydown', event => {
    if (event.key !== 'ArrowLeft' && event.key !== 'ArrowRight') return;
    event.preventDefault();
    const mode = event.key === 'ArrowLeft' ? 'quick' : 'voice-clone';
    tabs[mode].button.focus();
    selectMode(mode, true);
  });

  selectMode(new URLSearchParams(location.search).get('mode') || 'voice-clone', false);
})();
</script>
</body>
</html>
